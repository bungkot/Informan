# Override for development: the "dev" container contains Node + the OpenCode CLI,
# with code mounted from the host. Also used by .devcontainer.
services:
  dev:
    build:
      context: .
      target: dev
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_BASE_URL: http://ollama:11434/v1
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:2b-q4_K_M}
    volumes:
      - .:/workspace:cached
    working_dir: /workspace
    mem_limit: ${DEV_MEM_LIMIT:-1g}   # total stack (ollama 2g + dev 1g) = 3g
