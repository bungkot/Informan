name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  # CI-only: Claude-style model (Qwen3.5-based, 3.4 GB) with num_ctx 8192.
  # Local setup is NOT changed: docker-compose.yml / .env.example keep using
  # qwen2.5-coder:3b.
  OLLAMA_MODEL: claude-coder-4b-8k
  OLLAMA_CONTEXT_LENGTH: "8192"
  OLLAMA_KEEP_ALIVE: 5m
  OLLAMA_NUM_PARALLEL: "1"
  OLLAMA_MAX_LOADED_MODELS: "1"
  OLLAMA_FLASH_ATTENTION: "1"
  OLLAMA_KV_CACHE_TYPE: "q8_0"
  OLLAMA_BASE_URL: http://127.0.0.1:11434/v1
  NO_PROXY: localhost,127.0.0.1

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        run: |
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
              echo "Ollama is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Ollama is not responding"
          cat /tmp/ollama.log
          exit 1

      - name: Pull Claude-style model
        run: ollama pull rafw007/qwen35-claude-coder:4b

      - name: Create 8K context variant
        run: |
          cat > /tmp/Modelfile <<'EOF'
          FROM rafw007/qwen35-claude-coder:4b
          PARAMETER num_ctx 8192
          EOF
          ollama create "$OLLAMA_MODEL" -f /tmp/Modelfile

      - name: Doctor
        run: npm run doctor

      - name: Smoke test (ask)
        run: 'npm run ask -- "Reply with exactly one word: OK"'
